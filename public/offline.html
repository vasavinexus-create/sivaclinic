<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#126b5a" />
    <title>SivaCare Offline</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7f5;color:#17201d;font-family:Arial,sans-serif;padding:24px}
      main{width:min(420px,100%);background:#fff;border:1px solid #e5eae7;border-radius:14px;padding:28px;box-shadow:0 18px 48px #17342f18}
      .mark{width:48px;height:48px;border-radius:12px;background:#126b5a;color:#fff;display:grid;place-items:center;font:700 34px Georgia,serif;margin-bottom:18px}
      h1{font:700 26px Georgia,serif;margin:0 0 8px}
      p{font-size:14px;line-height:1.5;color:#68736f;margin:0 0 18px}
      button{height:40px;border:0;border-radius:8px;background:#126b5a;color:#fff;font-weight:700;padding:0 16px}
    </style>
  </head>
  <body>
    <main>
      <div class="mark">+</div>
      <h1>SivaCare is offline</h1>
      <p>Reconnect to the internet and refresh. Saved clinic data is protected in Supabase and will appear when the connection is back.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
